apiVersion: apps/v1
kind: Deployment
metadata:
  name: fracarc-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fracarc
  template:
    metadata:
      labels:
        app: fracarc
    spec:
      containers:
        - name: frontend
          image: fracarc/frontend:latest
          ports:
            - containerPort: 3000
        - name: gateway
          image: fracarc/gateway:latest
          ports:
            - containerPort: 3001
          env:
            - name: AI_SERVICE_URL
              value: http://ai-service:8000
        - name: ai-service
          image: fracarc/ai-service:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
